{% extends "chores/base.html" %}

{% block title %}Who are you?{% endblock %}

{% block content %}
    <h2>Who are you?</h2>
    <form method="post">
        {% csrf_token %}
        <p>
            {% for person in people %}
                <label>
                    <input type="radio" name="person_id" value="{{ person.id }}" required>
                    {{ person.name }}
                </label><br>
            {% endfor %}
        </p>
        <button type="submit">Continue</button>
    </form>
{% endblock %}
