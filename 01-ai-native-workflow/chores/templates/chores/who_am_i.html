{% extends "chores/base.html" %}

{% block title %}Who are you?{% endblock %}

{% block content %}
    <h2>Who are you?</h2>
    <form method="post" class="stack">
        {% csrf_token %}
        <div class="radio-field">
            {% for person in people %}
                <label>
                    <input type="radio" name="person_id" value="{{ person.id }}" required>
                    {{ person.name }}
                </label>
            {% endfor %}
        </div>
        <div class="actions">
            <button type="submit" class="btn">Continue</button>
        </div>
    </form>
{% endblock %}
