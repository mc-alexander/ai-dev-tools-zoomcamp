{% extends "chores/base.html" %}

{% block title %}Add person{% endblock %}

{% block content %}
    <h2>Add person</h2>
    <form method="post" class="stack">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div class="errors">{{ form.non_field_errors }}</div>
        {% endif %}
        <div class="field">
            <label for="{{ form.name.id_for_label }}">Name</label>
            {{ form.name }}
            {% if form.name.errors %}<div class="errors">{{ form.name.errors }}</div>{% endif %}
        </div>
        <div class="actions">
            <button type="submit" class="btn">Add person</button>
            <a href="{% url 'chores:people_list' %}" class="btn secondary">Cancel</a>
        </div>
    </form>
{% endblock %}
