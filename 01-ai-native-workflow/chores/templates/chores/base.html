<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Household Chores{% endblock %}</title>
    <style>
        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --accent: #0d9488;
            --accent-hover: #0f766e;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            max-width: 640px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 4rem;
            color: var(--text);
            line-height: 1.5;
            background: var(--bg);
        }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
        h1 a { text-decoration: none; color: inherit; }
        h2 { font-size: 1.125rem; font-weight: 600; margin: 0 0 1rem; }
        .muted { color: var(--muted); }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .header-extra { display: flex; gap: 0.75rem; align-items: center; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .chore-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.5rem; }
        .chore {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.875rem 1.125rem;
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 0.75rem 1rem;
            align-items: center;
        }
        .chore.completed { opacity: 0.65; }
        .chore .title { font-weight: 500; }
        .chore .title s { color: var(--muted); }
        .chore .meta { font-size: 0.8125rem; color: var(--muted); margin-top: 0.125rem; }
        .chore .state {
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: white;
            padding: 0.1875rem 0.5rem;
            border-radius: 999px;
            background: var(--accent);
        }
        .chore .state.due { color: #92400e; background: #fef3c7; }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 0.875rem;
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-family: inherit;
        }
        .btn:hover { background: var(--accent-hover); text-decoration: none; }
        .btn.secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn.secondary:hover { background: #f3f4f6; }
        .btn.danger {
            background: var(--surface);
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        .btn.danger:hover { background: #fef2f2; }

        .actions { display: flex; gap: 0.375rem; align-items: center; }

        form.stack {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 360px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
        }
        form.stack .field { display: flex; flex-direction: column; gap: 0.375rem; }
        form.stack .radio-field { display: flex; flex-direction: column; gap: 0.5rem; }
        form.stack .radio-field > label {
            font-size: 0.8125rem;
            font-weight: 500;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        form.stack label:not(.radio-field > label) {
            font-size: 0.8125rem;
            font-weight: 500;
            color: #374151;
        }
        form.stack input[type="text"],
        form.stack input[type="number"],
        form.stack select {
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.875rem;
            font-family: inherit;
            background: var(--surface);
            color: var(--text);
            width: 100%;
        }
        form.stack input:focus, form.stack select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }
        form.stack .help { font-size: 0.75rem; color: var(--muted); }
        form.stack .errors { color: #b91c1c; font-size: 0.8125rem; }
        form.stack .actions { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.25rem; }
        form.inline { display: inline; margin: 0; }

        .empty {
            background: var(--surface);
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: var(--muted);
        }
        .empty p { margin: 0 0 1rem; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        .toolbar a.active { font-weight: 600; color: var(--text); }

        .kanban { display: grid; gap: 1rem; }
        .column {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.875rem;
            min-width: 0;
        }
        .column h3 {
            margin: 0 0 0.75rem;
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .board-cards { display: flex; flex-direction: column; gap: 0.5rem; }
        .board-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.625rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .board-card.completed { opacity: 0.65; }
        .board-card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.5rem;
        }
        .board-card .title { font-weight: 500; font-size: 0.875rem; }
        .board-card .title s { color: var(--muted); }
        .board-card .meta { font-size: 0.75rem; color: var(--muted); }
        .board-empty { font-size: 0.8125rem; margin: 0; }

        .messages { list-style: none; padding: 0; margin: 0 0 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .message { padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.875rem; }
        .message.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .message.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="{% url 'chores:index' %}">Chores</a></h1>
        {% block header_extra %}{% endblock %}
    </div>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="message {{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
